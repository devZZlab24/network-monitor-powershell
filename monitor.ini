# =====================================================
#  Настройка мониторинга сети в секундах
# =====================================================

# Интервал замера, секунд
INTERVAL=2

# Основной DNS (auto = взять из настроек адаптера, обычно это роутер)
DNS_LOCAL=auto

# Внешний DNS для сравнения
DNS_EXTERNAL=8.8.8.8

# Имя хоста для DNS-проверок я взял яндекс
DNS_TEST_HOST=yandex.ru

# Цели для проверки канала (IP:порт), через запятую
TCP_TARGETS=1.1.1.1:443,8.8.8.8:53

# Пороги в миллисекундах: всё, что медленнее -флаг *_SLOW
DNS_SLOW_MS=3000
TCP_SLOW_MS=1000

# Флаги-включатели: 1 = проверять, 0 = не проверять
ENABLE_DNS=1
ENABLE_INET=1
ENABLE_GW=1
ENABLE_ADAPTER=1
